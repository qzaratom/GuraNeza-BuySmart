  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    /* Product Panel */

    .no-images { height: 400px; border-radius: 16px; background: rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); border: 1px dashed rgba(255, 107, 53, 0.2); }
    .product-info-section { flex: 1.2; min-width: 300px; display: flex; flex-direction: column; }

    .product-badges { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .badge { padding: 0.35rem 0.9rem; border-radius: 30px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem; }

    .badge.negotiable { background: rgba(255, 107, 53, 0.1); color: #FF6B35; border: 1px solid rgba(255, 107, 53, 0.3); }
    .badge.shop { background: rgba(102, 126, 234, 0.15); color: #667eea; border: 1px solid rgba(102, 126, 234, 0.3); cursor: pointer; }

    .product-price { font-size: 2.2rem; font-weight: 700; color: #FF6B35; margin-bottom: 0.8rem; }

    .product-category { display: flex; align-items: center; gap: 0.5rem; color: rgba(255,255,255,0.6); margin-bottom: 1.2rem; font-size: 0.9rem; }
    .action-buttons { display: flex; gap: 1rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
    .chat-button-large { background: linear-gradient(135deg, #FF6B35 0%, #FF4500 100%); color: white; border: none; padding: 0.8rem 2rem; border-radius: 60px; font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 0.6rem; cursor: pointer; flex: 1; min-width: 180px; box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.2s ease; }
    .chat-button-large:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4); }
    .add-to-cart-large { background: rgba(255, 255, 255, 0.05); color: white; border: 1px solid rgba(255, 107, 53, 0.3); padding: 0.8rem 2rem; border-radius: 60px; font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 0.6rem; cursor: pointer; flex: 1; min-width: 180px; transition: all 0.2s ease; }
    .add-to-cart-large:hover { background: rgba(255, 107, 53, 0.15); transform: translateY(-2px); }
    .product-description { color: rgba(255,255,255,0.8); line-height: 1.6; margin-bottom: 1.2rem; padding: 1.2rem; background: rgba(0,0,0,0.15); border-radius: 16px; border: 1px solid rgba(255, 107, 53, 0.1); font-size: 0.9rem; flex: 1; }
    .seller-info { background: rgba(0,0,0,0.15); border-radius: 16px; padding: 1.2rem; border: 1px solid rgba(255, 107, 53, 0.1); }
    .seller-info h3 { display: flex; align-items: center; gap: 0.5rem; color: #FF6B35; margin-bottom: 1rem; font-size: 1.1rem; }
    .seller-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 0.8rem; }
    .seller-item { display: flex; flex-direction: column; gap: 0.2rem; }
    .seller-label { font-size: 0.65rem; color: rgba(255,255,255,0.5); text-transform: uppercase; }
    .seller-value { font-weight: 600; color: white; display: flex; align-items: center; gap: 0.3rem; font-size: 0.85rem; }
    .visit-shop-btn { background: #FF6B35; color: white; border: none; padding: 0.6rem; border-radius: 40px; font-weight: 500; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1rem; width: 100%; }

    /* More Products */
    .more-products-section { background: rgba(26, 26, 46, 0.35); backdrop-filter: blur(16px) saturate(160%); border-radius: 20px; padding: 1.5rem; border: 1px solid rgba(255, 107, 53, 0.15); width: 100%; margin-top: 1rem; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .section-header h3 { font-size: 1.1rem; color: white; display: flex; align-items: center; gap: 0.5rem; }
    .section-header a { color: #FF6B35; text-decoration: none; font-weight: 500; font-size: 0.85rem; }
    .horizontal-scroll-wrapper { position: relative; display: flex; align-items: center; }

    .scroll-item-image { width: 100%; height: 150px; background-size: cover; background-position: center; position: relative; }

    .scroll-item-info { padding: 0.6rem; }

    .scroll-item-price { color: #FF6B35; font-weight: 700; font-size: 0.8rem; }

    /* Image Viewer */
    .image-viewer-modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
    .image-viewer-modal.active { display: flex; }
    .image-viewer-content { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .image-viewer-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem; cursor: pointer; width: 44px; height: 44px; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1001; }
    .image-viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; color: white; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1001; }

    .image-viewer-main { max-width: 100%; max-height: 100%; object-fit: contain; }
    .image-viewer-counter { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: white; background: rgba(0,0,0,0.6); padding: 0.4rem 1.2rem; border-radius: 50px; font-size: 0.9rem; }

    /* Footer */
    footer { background: rgba(26, 26, 46, 0.35); backdrop-filter: blur(16px); margin-top: 2.5rem; padding: 1.5rem 2rem 0.8rem; border-radius: 24px 24px 0 0; border-top: 1px solid rgba(255, 107, 53, 0.12); }
    .footer-content { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; color: white; }
    .footer-brand { display: flex; align-items: center; gap: 0.5rem; }
    .footer-brand img { width: 28px; height: 28px; object-fit: contain; }
    .footer-brand p { font-size: 0.85rem; font-weight: 500; }
    .social-only { display: flex; gap: 1rem; }
    .social-only a { font-size: 1.3rem; color: rgba(255, 255, 255, 0.6); transition: all 0.2s ease; }
    .social-only a:hover { color: #FF6B35; transform: translateY(-2px); }
    .copyright { width: 100%; text-align: center; font-size: 0.65rem; color: rgba(255, 255, 255, 0.4); margin-top: 1.2rem; padding-top: 0.8rem; border-top: 1px solid rgba(255, 107, 53, 0.1); }

    @media (max-width: 900px) { .product-panel { flex-direction: column; padding: 1rem; } .product-images-section { max-width: 100%; } .main-image-container { height: 300px; } .scroll-item { flex: 0 0 140px; } .scroll-item-image { height: 120px; } }

  </style>

  <header class="sticky-nav">
    <div class="nav-container"><div class="logo-area"><img src="gn.png" alt="GuraNeza" class="logo-icon-img"><div class="logo-text">GuraNeza <span>| BuySmart</span></div></div>
      <div class="nav-links"><a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a><a href="#" class="nav-item active"><i class="fas fa-shopping-cart"></i><span>Buy</span></a><a href="sell.html" class="nav-item"><i class="fas fa-plus-circle"></i><span>Sell</span></a><a href="shops.html" class="nav-item"><i class="fas fa-store"></i><span>Shops</span></a></div>
      <div class="header-actions"><div class="cart-indicator" id="cartIndicator" onclick="window.location.href='profile.html'"><i class="fas fa-shopping-basket"></i> <span>Cart</span> <span class="cart-badge" id="cartCount">0</span></div><div class="lang-switch"><span class="lang-option" data-lang="en">EN</span><span class="lang-option" data-lang="fr">FR</span><span class="lang-option" data-lang="rw">RW</span></div><div class="user-dropdown"><div class="user-profile" id="userProfile"><div class="user-avatar" id="userAvatar"><i class="fas fa-user-circle"></i></div><span class="user-name" id="userName">Guest</span></div><div class="user-dropdown-content"><a href="profile.html"><i class="fas fa-user"></i> Profile</a><a href="#" id="logoutBtn" style="display: none;"><i class="fas fa-sign-out-alt"></i> Logout</a><a href="login.html" id="loginDropdownBtn"><i class="fas fa-sign-in-alt"></i> Login</a></div></div></div>
    </div>
  </header>

  <div id="toastContainer" class="toast-container"></div>

  <main class="container">
    <div class="product-panel" id="productPanel"><div class="loading-spinner" style="width:100%;"><div class="spinner"></div><p style="margin-top:0.8rem;color:rgba(255,255,255,0.7);">Loading product...</p></div></div>
    <div class="more-products-section"><div class="section-header"><h3><i class="fas fa-layer-group"></i> More Products</h3><a href="home.html">View all <i class="fas fa-arrow-right"></i></a></div><div class="horizontal-scroll-wrapper"><button class="scroll-btn left" id="scrollLeftBtn"><i class="fas fa-chevron-left"></i></button><div class="horizontal-scroll" id="horizontalScroll"></div><button class="scroll-btn right" id="scrollRightBtn"><i class="fas fa-chevron-right"></i></button></div></div>
  </main>

  <footer><div class="footer-content"><div class="footer-brand"><img src="gn.png" alt="GuraNeza"><p>© 2026 GuraNeza | BuySmart</p></div><div class="social-only"><a href="#"><i class="fab fa-tiktok"></i></a><a href="#"><i class="fab fa-youtube"></i></a><a href="#"><i class="fab fa-instagram"></i></a><a href="#"><i class="fab fa-x-twitter"></i></a></div></div><div class="copyright">Buy Smart, Sell Easy · @guraneza</div></footer>

  <script>
    window.scrollProductsLeft = function() { const c = document.getElementById('horizontalScroll'); if (c) { const w = c.querySelector('.scroll-item')?.offsetWidth || 180; c.scrollBy({ left: -((w+16)*2), behavior: 'smooth' }); } };
    window.scrollProductsRight = function() { const c = document.getElementById('horizontalScroll'); if (c) { const w = c.querySelector('.scroll-item')?.offsetWidth || 180; c.scrollBy({ left: (w+16)*2, behavior: 'smooth' }); } };
    document.addEventListener('DOMContentLoaded', function() {
      const a=document.getElementById('menuFabMain'),b=document.getElementById('menuFabPopup');a.addEventListener('click',function(e){e.stopPropagation();b.classList.toggle('active');a.classList.toggle('active')});document.addEventListener('click',function(e){if(!a.contains(e.target)&&!b.contains(e.target)){b.classList.remove('active');a.classList.remove('active')}});
      document.getElementById('scrollLeftBtn')?.addEventListener('click',function(e){e.preventDefault();window.scrollProductsLeft();});
      document.getElementById('scrollRightBtn')?.addEventListener('click',function(e){e.preventDefault();window.scrollProductsRight();});
    });
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyAr6-rTa8yQCxr41JjWysFLHeFxH0C2IMI", authDomain: "guraneza-714f7.firebaseapp.com", databaseURL: "https://guraneza-714f7-default-rtdb.firebaseio.com", projectId: "guraneza-714f7", storageBucket: "guraneza-714f7.firebasestorage.app", messagingSenderId: "457107620336", appId: "1:457107620336:web:1583db305b03528fcf5d35" };
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    let currentUser = null, currentProduct = null, productImages = [], currentImageIndex = 0, allProducts = [], shopsData = [];
    const productPanel = document.getElementById('productPanel'), horizontalScroll = document.getElementById('horizontalScroll'), cartCount = document.getElementById('cartCount');
    const userAvatar = document.getElementById('userAvatar'), userName = document.getElementById('userName'), logoutBtn = document.getElementById('logoutBtn'), loginDropdownBtn = document.getElementById('loginDropdownBtn'), menuLogoutBtn = document.getElementById('menuLogoutBtn');

    function showToast(m, t = 'success') { const c = document.getElementById('toastContainer'), d = document.createElement('div'); d.className = `toast ${t}`; d.innerHTML = `<div class="toast-icon"><i class="fas fa-${t==='success'?'check':'exclamation'}-circle"></i></div><div class="toast-content"><div class="toast-title">${t}</div><div class="toast-message">${m}</div></div><div class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></div>`; c.appendChild(d); setTimeout(() => d.classList.add('show'), 10); setTimeout(() => { d.classList.remove('show'); setTimeout(() => d.remove(), 200); }, 3000); }
    function getProductId() { return new URLSearchParams(window.location.search).get('id'); }

    async function loadCart() { if (!currentUser) { cartCount.textContent = '0'; return; } try { const s = await get(ref(database, `carts/${currentUser.uid}`)); cartCount.textContent = s.exists() ? Object.keys(s.val()).length : '0'; } catch { cartCount.textContent = '0'; } }
    async function updateProfile(user) { if (user) { try { const s = await get(ref(database, `users/${user.uid}`)); if (s.exists()) { const p = s.val(); userName.textContent = p.displayName || user.email?.split('@')[0] || 'User'; if (p.profileImage) userAvatar.innerHTML = `<img src="${p.profileImage}" alt="">`; } logoutBtn.style.display = 'flex'; loginDropdownBtn.style.display = 'none'; if (menuLogoutBtn) menuLogoutBtn.style.display = 'flex'; } catch { userName.textContent = user.email?.split('@')[0] || 'User'; logoutBtn.style.display = 'flex'; loginDropdownBtn.style.display = 'none'; } } else { userName.textContent = 'Guest'; userAvatar.innerHTML = '<i class="fas fa-user-circle"></i>'; logoutBtn.style.display = 'none'; loginDropdownBtn.style.display = 'flex'; if (menuLogoutBtn) menuLogoutBtn.style.display = 'none'; } }

    window.addToCart = async function() { if (!currentProduct) return; if (!currentUser) { showToast('Please log in', 'warning'); setTimeout(() => window.location.href = 'login.html', 1200); return; } try { const cr = ref(database, `carts/${currentUser.uid}`); const s = await get(cr); let exists = false; if (s.exists()) { const items = s.val(); for (const key in items) { if (items[key].id === currentProduct.id) { exists = true; break; } } } if (!exists) { await set(push(cr), { id: currentProduct.id, name: currentProduct.name, price: currentProduct.price, addedAt: new Date().toISOString(), shopId: currentProduct.shopId || '', shopName: currentProduct.shopName || '', verified: currentProduct.verified || false }); await loadCart(); showToast(`${currentProduct.name} added to cart`, 'success'); } else showToast(`${currentProduct.name} is already in cart`, 'warning'); } catch (e) { showToast('Error adding to cart', 'error'); } };

    // 🔥 FIXED: openChat now properly fetches shop owner email from shops database
    window.openChat = async function() {
      if (!currentProduct) return;
      if (!currentUser) { showToast('Please log in to chat', 'warning'); setTimeout(() => window.location.href = 'login.html', 1200); return; }
      
      let sellerEmail = '';
      
      if (currentProduct.isFromShop && currentProduct.shopId) {
        // Find the shop from our loaded shops data
        const shop = shopsData.find(s => s.id === currentProduct.shopId);
        if (shop) {
          // Try to get owner email from shop
          sellerEmail = shop.ownerEmail || shop.email || shop.contact?.email || '';
          console.log('Found shop:', shop.name, 'Owner email:', sellerEmail);
          
          // If no email found in shop data, try to find it from the product's sellerEmail
          if (!sellerEmail && currentProduct.seller?.email) {
            sellerEmail = currentProduct.seller.email;
          }
        }
      } else {
        // Individual seller - get email from product data
        sellerEmail = currentProduct.seller?.email || '';
      }
      
      if (!sellerEmail) { showToast('Seller email not available. Cannot start chat.', 'error'); return; }
      if (sellerEmail === currentUser.email) { showToast('You cannot chat with yourself', 'warning'); return; }
      
      try {
        const cr = ref(database, 'chats'); const allChatsSnap = await get(cr); let exists = false;
        if (allChatsSnap.exists()) { const allChats = allChatsSnap.val(); for (const key in allChats) { const chat = allChats[key]; if (chat.productId === currentProduct.id && ((chat.sender === currentUser.email && chat.receiver === sellerEmail) || (chat.sender === sellerEmail && chat.receiver === currentUser.email))) { exists = true; break; } } }
        if (!exists) {
          await set(push(cr), { sender: currentUser.email, receiver: sellerEmail, message: `Hello, I'm interested in your product: ${currentProduct.name}`, timestamp: new Date().toISOString(), productId: currentProduct.id, productName: currentProduct.name, read: false });
          showToast('Chat started successfully', 'success');
        }
        sessionStorage.setItem('chatProduct', JSON.stringify({ id: currentProduct.id, name: currentProduct.name, seller: sellerEmail }));
        setTimeout(() => { window.location.href = 'chats.html'; }, 500);
      } catch (e) { console.error(e); showToast('Error starting chat', 'error'); }
    };

    window.openImageViewer = function(idx) { if (!productImages.length) return; currentImageIndex = idx; document.getElementById('viewerMainImage').src = productImages[idx]; document.getElementById('imageCounter').innerText = `${idx+1} / ${productImages.length}`; document.getElementById('prevImageBtn').disabled = idx === 0; document.getElementById('nextImageBtn').disabled = idx === productImages.length - 1; document.getElementById('imageViewerModal').classList.add('active'); };
    window.closeImageViewer = function() { document.getElementById('imageViewerModal').classList.remove('active'); };
    window.navigateImage = function(d) { const n = currentImageIndex + d; if (n >= 0 && n < productImages.length) window.openImageViewer(n); };
    window.changeMainImage = function(el, url, idx) { document.getElementById('mainImage').style.backgroundImage = `url('${url}')`; document.querySelectorAll('.image-thumbnail').forEach(t => t.classList.remove('active')); el.classList.add('active'); currentImageIndex = idx; };

    // 🔥 FIXED: loadShops now fetches all shop data including emails
    async function loadShops() {
      try {
        const s = await get(ref(database, 'shops'));
        shopsData = [];
        if (s.exists()) {
          const data = s.val();
          for (const k in data) {
            const v = data[k];
            shopsData.push({
              id: v.shopId || k,
              firebaseKey: k,
              name: v.name || '',
              phone: v.contact?.phone || '',
              email: v.contact?.email || '',
              ownerEmail: v.ownerEmail || v.createdByEmail || v.contact?.email || '',
              location: v.location || '',
              description: v.description || '',
              category: v.category || '',
              verified: v.verified || false
            });
          }
        }
        console.log('Loaded shops:', shopsData.length, shopsData.map(s => ({ name: s.name, email: s.ownerEmail || s.email })));
        return shopsData;
      } catch (e) { console.error('Error loading shops:', e); return []; }
    }

    async function loadAllProducts() {
      try {
        const snap = await get(ref(database, 'products'));
        if (snap.exists()) {
          const data = snap.val(); allProducts = [];
          for (const key in data) {
            const product = data[key]; const images = [];
            if (product.image1) images.push(product.image1); if (product.image2) images.push(product.image2); if (product.image3) images.push(product.image3);
            allProducts.push({ id: product.productId || key, name: product.name || 'Unnamed', category: product.category || 'Other', description: product.description || '', verified: product.verified || false, price: parseFloat(product.price) || 0, images, timestamp: product.timestamp || new Date().toISOString(), shopId: product.shopId || '', shopName: product.shopName || '' });
          }
          allProducts.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)); renderHorizontalScroll();
        }
      } catch (e) { console.error('Error loading all products:', e); }
    }

    function renderHorizontalScroll() {
      if (!horizontalScroll) return;
      const otherProducts = currentProduct ? allProducts.filter(p => p.id !== currentProduct.id).slice(0, 20) : allProducts.slice(0, 20);
      if (!otherProducts.length) { horizontalScroll.innerHTML = '<div style="text-align:center;padding:1rem;color:rgba(255,255,255,0.5);width:100%;">No other products available</div>'; return; }
      horizontalScroll.innerHTML = otherProducts.map(p => `<div class="scroll-item" onclick="window.location.href='?id=${p.id}'"><div class="scroll-item-image" style="background-image: url('${p.images[0] || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&auto=format'}')">${p.verified ? '<div class="scroll-item-badge"><i class="fas fa-check-circle"></i></div>' : ''}</div><div class="scroll-item-info"><div class="scroll-item-name">${p.name}</div><div class="scroll-item-price">${p.price.toLocaleString()} RWF</div></div></div>`).join('');
    }

    async function loadProduct() {
      const pid = getProductId();
      if (!pid) { productPanel.innerHTML = '<div class="no-images" style="padding:2rem;display:flex;align-items:center;justify-content:center;width:100%;"><i class="fas fa-box-open"></i> No product selected</div>'; return; }
      productPanel.innerHTML = '<div class="loading-spinner" style="width:100%;"><div class="spinner"></div><p style="margin-top:0.8rem;color:rgba(255,255,255,0.7);">Loading product...</p></div>';
      try {
        const shops = await loadShops(); const s = await get(ref(database, 'products'));
        if (!s.exists()) throw new Error('No products found');
        let found = null; const data = s.val();
        for (const k in data) { const p = data[k]; if (p.productId === pid || p.id === pid || k === pid) { found = p; break; } }
        if (!found) throw new Error('Product not found');
        
        const isFromShop = !!found.shopId; let sellerInfo = {}, sellerEmail = '';
        if (isFromShop) {
          const shop = shops.find(sh => sh.id === found.shopId);
          sellerInfo = { name: shop?.name || found.shopName || 'Unknown Shop', phone: shop?.phone || found.shopPhone || 'N/A', location: shop?.location || found.shopLocation || 'N/A', email: shop?.ownerEmail || shop?.email || found.shopEmail || '' };
          sellerEmail = shop?.ownerEmail || shop?.email || found.shopEmail || '';
          console.log('Shop product - seller email from shop:', sellerEmail, 'Shop:', shop?.name);
        } else {
          sellerInfo = { name: found.seller?.name || found.sellerName || found.postedBy || 'Unknown Seller', phone: found.seller?.phone || found.sellerPhone || 'N/A', location: found.seller?.location || found.sellerLocation || 'N/A', email: found.seller?.email || found.sellerEmail || '' };
          sellerEmail = found.seller?.email || found.sellerEmail || '';
          console.log('Individual product - seller email:', sellerEmail);
        }
        
        productImages = []; if (found.image1) productImages.push(found.image1); if (found.image2) productImages.push(found.image2); if (found.image3) productImages.push(found.image3);
        currentProduct = { id: found.productId || pid, name: found.name || 'Unnamed', category: found.category || 'Other', description: found.description || 'No description', negociable: found.negotiable || false, verified: found.verified || false, price: parseFloat(found.price) || 0, images: productImages, seller: sellerInfo, isFromShop, shopId: found.shopId, sellerEmail };
        
        const imgsHtml = productImages.length ? `<div class="product-images-section"><div class="main-image-container" onclick="window.openImageViewer(0)"><div class="main-image" id="mainImage" style="background-image:url('${productImages[0]}')"></div></div><div class="image-thumbnails">${productImages.map((img,i) => `<div class="image-thumbnail ${i===0?'active':''}" style="background-image:url('${img}')" onclick="event.stopPropagation();window.changeMainImage(this,'${img}',${i})"></div>`).join('')}</div></div>` : '<div class="no-images"><i class="fas fa-image"></i><p>No images available</p></div>';
        productPanel.innerHTML = imgsHtml + `<div class="product-info-section"><h1 class="product-title">${currentProduct.name}</h1><div class="product-badges">${isFromShop?`<span class="badge shop" onclick="window.location.href='letshop.html?shop=${currentProduct.shopId}'"><i class="fas fa-store"></i> Visit Shop →</span>`:'<span class="badge individual"><i class="fas fa-user"></i> Individual</span>'}${currentProduct.verified?'<span class="badge verified"><i class="fas fa-check-circle"></i> Verified</span>':''}${currentProduct.negociable?'<span class="badge negotiable"><i class="fas fa-handshake"></i> Negotiable</span>':''}</div><div class="product-price">${currentProduct.price.toLocaleString()}<small>RWF</small></div><div class="product-category"><i class="fas fa-folder"></i> ${currentProduct.category}</div><div class="action-buttons"><button class="chat-button-large" onclick="window.openChat()"><i class="fas fa-comments"></i> Chat with ${isFromShop?'Shop':'Seller'}</button><button class="add-to-cart-large" onclick="window.addToCart()"><i class="fas fa-shopping-cart"></i> Add to Cart</button></div><div class="product-description">${currentProduct.description}</div><div class="seller-info"><h3><i class="fas fa-${isFromShop?'store':'user-circle'}"></i> ${isFromShop?'Shop Information':'Seller Information'}</h3><div class="seller-grid"><div class="seller-item"><span class="seller-label">Name</span><span class="seller-value">${sellerInfo.name}</span></div><div class="seller-item"><span class="seller-label">Phone</span><span class="seller-value">${sellerInfo.phone}</span></div><div class="seller-item"><span class="seller-label">Location</span><span class="seller-value">${sellerInfo.location}</span></div>${sellerInfo.email?`<div class="seller-item"><span class="seller-label">Email</span><span class="seller-value">${sellerInfo.email}</span></div>`:''}</div>${isFromShop?`<button class="visit-shop-btn" onclick="window.location.href='letshop.html?shop=${currentProduct.shopId}'"><i class="fas fa-store"></i> Visit Shop <i class="fas fa-arrow-right"></i></button>`:''}</div></div>`;
        await loadAllProducts();
      } catch (e) { productPanel.innerHTML = `<div class="no-images" style="padding:2rem;display:flex;align-items:center;justify-content:center;width:100%;"><i class="fas fa-exclamation-triangle"></i> ${e.message}</div>`; }
    }

    onAuthStateChanged(auth, async (user) => { currentUser = user; await updateProfile(user); await loadCart(); await loadProduct(); });
    logoutBtn.addEventListener('click', async (e) => { e.preventDefault(); await signOut(auth); showToast('Logged out', 'success'); setTimeout(() => window.location.href = 'index.html', 1000); });
    if (menuLogoutBtn) menuLogoutBtn.addEventListener('click', async () => { await signOut(auth); showToast('Logged out', 'success'); setTimeout(() => window.location.href = 'index.html', 1000); });
    document.querySelectorAll('.lang-option').forEach(o => { let l = localStorage.getItem('guraneza_lang') || 'en'; o.classList.toggle('active', o.dataset.lang === l); o.addEventListener('click', () => { localStorage.setItem('guraneza_lang', o.dataset.lang); document.querySelectorAll('.lang-option').forEach(x => x.classList.toggle('active', x.dataset.lang === o.dataset.lang)); }); });
  </script>
