<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuraNeza · BuySmart</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="gn.png">
  <link rel="icon" type="image/png" sizes="16x16" href="gn.png">
  <link rel="apple-touch-icon" sizes="180x180" href="gn.png">
  <link rel="shortcut icon" href="gn.png">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body { 
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #ffffff;
      line-height: 1.4;
      position: relative;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?q=80&w=2070&auto=format&fit=crop') center/cover;
      opacity: 0.1;
      z-index: -1;
      animation: slowPan 40s infinite alternate;
    }
    
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 107, 53, 0.03) 0%, rgba(26, 26, 46, 0.2) 100%);
      z-index: -1;
    }
    
    @keyframes slowPan {
      from { transform: scale(1) translateX(0); }
      to { transform: scale(1.1) translateX(-1%); }
    }

    /* 🔹 THREE DOTS MENU - Bottom Right */
    .menu-fab-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .menu-fab-popup {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 12px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .menu-fab-popup.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-fab-item {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .menu-fab-item:hover .menu-fab-label {
      opacity: 1;
      transform: translateX(0);
    }

    .menu-fab-item:hover .menu-fab-icon {
      transform: scale(1.1);
    }

    .menu-fab-label {
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(10px);
      color: white;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(10px);
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 107, 53, 0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .menu-fab-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .menu-fab-icon.chat {
      background: linear-gradient(135deg, #FF6B35 0%, #FF4500 100%);
      color: white;
    }

    .menu-fab-icon.upgrade {
      background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
      color: #1a1a2e;
    }

    .menu-fab-icon.help {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .menu-fab-icon.logout {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }

    .menu-fab-main {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #1a1a2e;
      color: #FF6B35;
      border: 1px solid rgba(255, 107, 53, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .menu-fab-main:hover {
      transform: scale(1.05);
      background: #FF6B35;
      color: white;
    }

    .menu-fab-main i {
      transition: transform 0.3s ease;
    }

    .menu-fab-main.active {
      background: #FF6B35;
      color: white;
    }

    /* 🔹 HEADER - Glass design */
    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(26, 26, 46, 0.35);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border-bottom: 1px solid rgba(255, 107, 53, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    
    .nav-container {
      width: 100%;
      padding: 0.6rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    
    .logo-area { 
      display: flex; 
      align-items: center; 
      gap: 0.5rem;
      flex: 1;
    }
    
    .logo-icon-img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      filter: drop-shadow(0 3px 8px rgba(255, 107, 53, 0.3));
      transition: transform 0.2s ease;
    }
    
    .logo-icon-img:hover {
      transform: scale(1.03);
    }
    
    .logo-text { 
      font-weight: 650; 
      font-size: 1.2rem; 
      letter-spacing: -0.01em; 
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    
    .logo-text span { 
      color: #FF6B35;
      font-weight: 300;
    }

    /* Navigation buttons - Centered, text only */
    .nav-links { 
      display: flex; 
      gap: 2rem; 
      align-items: center;
      justify-content: center;
      flex: 2;
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.35rem 0;
      transition: all 0.2s ease;
      background: transparent;
      border: none;
      cursor: pointer;
      position: relative;
    }
    
    .nav-item::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1.5px;
      background: #FF6B35;
      transition: width 0.2s ease;
    }
    
    .nav-item:hover {
      color: #FF6B35;
    }
    
    .nav-item:hover::after {
      width: 100%;
    }
    
    .nav-item i { 
      font-size: 0.95rem; 
      color: rgba(255, 255, 255, 0.6);
      transition: color 0.2s ease;
    }
    
    .nav-item:hover i {
      color: #FF6B35;
    }
    
    .nav-item.active { 
      color: #FF6B35; 
    }
    
    .nav-item.active::after {
      width: 100%;
    }
    
    .nav-item.active i { 
      color: #FF6B35; 
    }

    /* Right side - Cart, Language, User Profile */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex: 1;
      justify-content: flex-end;
    }
    
    .cart-indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0.35rem 0;
      transition: all 0.2s ease;
      background: transparent;
      position: relative;
    }
    
    .cart-indicator::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1.5px;
      background: #FF6B35;
      transition: width 0.2s ease;
    }
    
    .cart-indicator:hover {
      color: #FF6B35;
    }
    
    .cart-indicator:hover::after {
      width: 100%;
    }
    
    .cart-indicator i {
      color: #FF6B35;
      font-size: 0.9rem;
    }
    
    .cart-badge {
      background: #FF6B35;
      color: white;
      border-radius: 20px;
      padding: 0.1rem 0.4rem;
      font-size: 0.6rem;
      margin-left: 0.2rem;
    }

    .lang-switch {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      padding: 0.15rem;
      border-radius: 30px;
      border: 1px solid rgba(255, 107, 53, 0.15);
    }
    
    .lang-option {
      padding: 0.3rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.75);
      user-select: none;
      transition: all 0.2s ease;
    }
    
    .lang-option:hover {
      background: rgba(255, 107, 53, 0.15);
      color: white;
    }
    
    .lang-option.active { 
      background: #FF6B35;
      color: white;
    }

    /* User Profile - No round background */
    .user-dropdown {
      position: relative;
    }
    
    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding: 0.35rem 0;
      transition: all 0.2s ease;
      background: transparent;
      position: relative;
    }
    
    .user-profile::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1.5px;
      background: #FF6B35;
      transition: width 0.2s ease;
    }
    
    .user-profile:hover::after {
      width: 100%;
    }
    
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FF6B35;
      font-size: 1.3rem;
      overflow: hidden;
    }
    
    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    
    .user-name {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.85rem;
      font-weight: 500;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .user-dropdown-content {
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(16px);
      min-width: 180px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 0.3rem 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 107, 53, 0.2);
      z-index: 10;
    }
    
    .user-dropdown:hover .user-dropdown-content {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    
    .user-dropdown-content a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem 1.2rem;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.8rem;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    
    .user-dropdown-content a i {
      width: 18px;
      color: #FF6B35;
    }
    
    .user-dropdown-content a:hover {
      background: rgba(255, 107, 53, 0.15);
      color: white;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 200;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
    }
    
    .modal.active { display: flex; }
    
    .modal-content {
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(16px);
      max-width: 340px;
      width: 90%;
      padding: 1.8rem;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
      position: relative;
      border: 1px solid rgba(255, 107, 53, 0.2);
    }
    
    .modal-content h3 { 
      font-size: 1.4rem; 
      background: linear-gradient(135deg, #FF6B35 0%, #ff8a5c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.2rem;
    }
    
    .modal-content p { 
      margin: 0.7rem 0; 
      display: flex; 
      align-items: center; 
      gap: 0.8rem;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.85rem;
    }
    
    .modal-content i { 
      width: 1.6rem; 
      color: #FF6B35;
      font-size: 1rem;
    }
    
    .modal-content a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 0.85rem;
    }
    
    .modal-content a:hover {
      color: #FF6B35;
    }
    
    .close-modal { 
      position: absolute; 
      top: 0.8rem; 
      right: 1rem; 
      font-size: 1.6rem; 
      cursor: pointer; 
      color: rgba(255, 255, 255, 0.5);
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
    }
    
    .close-modal:hover {
      background: rgba(255, 107, 53, 0.15);
      color: #FF6B35;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 80px;
      right: 20px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(16px);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      padding: 10px 14px;
      min-width: 240px;
      max-width: 280px;
      transform: translateX(120%);
      transition: transform 0.25s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      border: 1px solid rgba(255, 107, 53, 0.2);
    }

    .toast.show { transform: translateX(0); }
    .toast-icon { width: 28px; height: 28px; border-radius: 8px; background: #FF6B35; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.8rem; }
    .toast-content { flex: 1; }
    .toast-title { font-weight: 600; color: white; margin-bottom: 2px; font-size: 0.8rem; }
    .toast-message { color: rgba(255, 255, 255, 0.7); font-size: 0.7rem; }
    .toast-close { color: rgba(255, 255, 255, 0.5); cursor: pointer; font-size: 0.8rem; }
    .toast.error { border-left-color: #ef4444; }
    .toast.error .toast-icon { background: #ef4444; }
    .toast.warning { border-left-color: #f59e0b; }
    .toast.warning .toast-icon { background: #f59e0b; }

    /* Main Container */
    .container { 
      width: 100%;
      padding: 1.2rem 2rem;
    }

    /* 🔹 STICKY FILTERS BAR */
    .filters-bar {
      position: sticky;
      top: 62px;
      z-index: 95;
      background: rgba(26, 26, 46, 0.35);
      backdrop-filter: blur(16px) saturate(160%);
      border-radius: 40px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      margin: 0 0 1.5rem 0;
      border: 1px solid rgba(255, 107, 53, 0.12);
      padding: 0.5rem 0.8rem;
      width: 100%;
    }
    
    .filters-row {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      width: 100%;
    }
    
    .search-wrapper {
      flex: 2.5;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: transparent;
      padding: 0 0.5rem 0 1.2rem;
    }
    
    .search-wrapper i {
      color: #FF6B35;
      font-size: 0.9rem;
    }
    
    .search-wrapper input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 0.85rem;
      padding: 0.5rem 0;
      outline: none;
      color: white;
    }
    
    .search-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }
    
    .price-filter {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 1.8;
      padding: 0 0.8rem;
      border-left: 1px solid rgba(255, 107, 53, 0.15);
      border-right: 1px solid rgba(255, 107, 53, 0.15);
    }
    
    .price-filter i {
      color: #FF6B35;
      font-size: 0.8rem;
    }
    
    .price-filter input {
      width: 0;
      flex: 1;
      min-width: 60px;
      border: none;
      padding: 0.35rem 0;
      font-size: 0.75rem;
      outline: none;
      background: transparent;
      text-align: center;
      border-bottom: 1px dashed rgba(255, 107, 53, 0.3);
      color: white;
    }
    
    .price-filter input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    
    .price-filter span {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.7rem;
    }
    
    .category-dropdown {
      position: relative;
      flex: 1.2;
    }
    
    .category-dropbtn {
      background: transparent;
      border: none;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      padding: 0.5rem 1.8rem 0.5rem 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      white-space: nowrap;
      width: 100%;
    }
    
    .category-dropbtn:hover {
      color: #FF6B35;
    }
    
    .category-dropbtn i { 
      font-size: 0.65rem; 
      color: #FF6B35;
    }
    
    .category-dropdown-content {
      position: absolute;
      top: calc(100% + 0.3rem);
      left: 0;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(16px);
      min-width: 180px;
      max-height: 350px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 0.3rem 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 107, 53, 0.2);
      z-index: 10;
    }
    
    .category-dropdown:hover .category-dropdown-content { 
      opacity: 1; 
      visibility: visible; 
      transform: translateY(0);
    }
    
    .category-dropdown-content a {
      display: block;
      padding: 0.5rem 1.2rem;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.8rem;
      cursor: pointer;
    }
    
    .category-dropdown-content a:hover { 
      background: rgba(255, 107, 53, 0.15);
      color: #FF6B35;
    }
    
    .filter-actions {
      display: flex;
      gap: 0.5rem;
      padding-right: 0.3rem;
    }
    
    .filter-btn {
      background: #FF6B35;
      border: none;
      color: white;
      font-weight: 500;
      padding: 0.5rem 1.5rem;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.25);
      white-space: nowrap;
    }
    
    .filter-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255, 107, 53, 0.35);
      background: #ff7a4a;
    }
    
    .refresh-btn {
      width: 38px;
      height: 38px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 107, 53, 0.15);
      color: #FF6B35;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }
    
    .refresh-btn:hover {
      background: rgba(255, 107, 53, 0.12);
      transform: translateY(-1px);
    }

    /* 🔹 SCROLL TO TOP BUTTON - On Filter Bar at Extreme Right */
    .scroll-top-btn {
      width: 38px;
      height: 38px;
      border-radius: 30px;
      background: #FF6B35;
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.25);
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
      opacity: 0;
      visibility: hidden;
      margin-left: 0.3rem;
    }

    .scroll-top-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    .scroll-top-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(255, 107, 53, 0.35);
    }

    .loading-spinner { 
      text-align: center; 
      padding: 3rem 1.5rem;
      background: rgba(26, 26, 46, 0.3);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      border: 1px solid rgba(255, 107, 53, 0.1);
    }
    
    .spinner { 
      display: inline-block; 
      width: 36px;

    function updateLanguage() {
      document.querySelectorAll('[data-i18n]').forEach(el => { 
        const key = el.getAttribute('data-i18n');
        if (el.tagName === 'INPUT' && el.hasAttribute('placeholder')) {
          el.placeholder = t(key);
        } else {
          el.textContent = t(key);
        }
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
      document.querySelectorAll('.lang-option').forEach(opt => { opt.classList.toggle('active', opt.dataset.lang === currentLang); });
      const btn = document.getElementById('categoryDropdownBtn');
      if (btn && selectedCategory === 'all') { btn.querySelector('span').textContent = t('allCategories'); }
      if (!currentUser) userName.textContent = t('guest');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
      toast.innerHTML = `
        <div class="toast-icon"><i class="fas ${icons[type]}"></i></div>
        <div class="toast-content"><div class="toast-title">${t(type)}</div><div class="toast-message">${message}</div></div>
        <div class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></div>
      `;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 200); }, 3000);

    async function updateUserProfile(user) {
      if (user) {
        try {
          const snap = await get(ref(database, `users/${user.uid}`));
          if (snap.exists()) {
            const p = snap.val();
            userName.textContent = p.displayName || user.email?.split('@')[0] || 'User';
            if (p.profileImage) userAvatar.innerHTML = `<img src="${p.profileImage}" alt="">`;
            else userAvatar.innerHTML = '<i class="fas fa-user-circle"></i>';
          } else {
            userName.textContent = user.email?.split('@')[0] || 'User';
            userAvatar.innerHTML = '<i class="fas fa-user-circle"></i>';
          }
          logoutBtn.style.display = 'flex';
          loginDropdownBtn.style.display = 'none';
          menuLogoutBtn.style.display = 'flex';

          userName.textContent = user.email?.split('@')[0] || 'User';
          userAvatar.innerHTML = '<i class="fas fa-user-circle"></i>';
          logoutBtn.style.display = 'flex';
          loginDropdownBtn.style.display = 'none';
          menuLogoutBtn.style.display = 'flex';

      } else {
        userName.textContent = t('guest');
        userAvatar.innerHTML = '<i class="fas fa-user-circle"></i>';
        logoutBtn.style.display = 'none';
        loginDropdownBtn.style.display = 'flex';
        menuLogoutBtn.style.display = 'none';
        cartCount.textContent = '0';
      }
    }

    async function loadUserCart() {
      if (!currentUser) { cartCount.textContent = '0'; return; }
      try {
        const snap = await get(ref(database, `carts/${currentUser.uid}`));
        const count = snap.exists() ? Object.keys(snap.val()).length : '0';
        cartCount.textContent = count;
      } catch { cartCount.textContent = '0'; }
    }

    window.addToCart = async function(productId, event) {
      event.stopPropagation();
      const product = products.find(p => p.id === productId);
      if (!product) return showToast(t('productNotFound'), 'error');
      if (!currentUser) {
        showToast(t('pleaseLogin'), 'warning');
        setTimeout(() => window.location.href = 'login.html', 1200);
        return;
      }
      try {
        const userCartRef = ref(database, `carts/${currentUser.uid}`);
        const snap = await get(userCartRef);
        let exists = false;
        if (snap.exists()) for (const item of Object.values(snap.val())) if (item.id === productId) { exists = true; break; }
        if (!exists) {
          const cartItem = { 
            id: product.id, name: product.name, price: parseFloat(product.price)||0, addedAt: new Date().toISOString(),
            category: product.category||'', description: product.description||'', shopId: product.shopId||'', 
            shopName: product.shopName||'', verified: product.verified||false, negociable: product.negociable||false 
          };
          if (product.images?.length) { 
            cartItem.images = {}; 
            product.images.forEach((img,i)=> { if(img) cartItem.images[`image${i+1}`]=img; }); 
          }
          await set(push(userCartRef), cartItem);
          await loadUserCart();
          showToast(`${product.name} ${t('addedToCart')}`, 'success');
        } else showToast(`${product.name} ${t('alreadyInCart')}`, 'warning');
      } catch (err) { showToast(t('errorAddingToCart'), 'error'); }
    };

    async function loadShops() {
      const snap = await get(ref(database, 'shops'));
      if (snap.exists()) shops = Object.entries(snap.val()).map(([k,v])=> ({ id: v.shopId||k, name: v.name||'', phone: v.contact?.phone||'', location: v.location||'' }));
    }

    function fetchProducts() {
      loadingSpinner.style.display = 'block';
      productGrid.style.display = 'none';
      onValue(ref(database, 'products'), (snap) => {
        if (!snap.exists()) {
          products = []; allProducts = [];
          loadingSpinner.style.display = 'none';
          productGrid.style.display = 'grid';
          productGrid.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><h3>${t('noProducts')}</h3></div>`;
          return;
        }
        const data = snap.val();
        products = Object.keys(data).map(key => {
          const p = data[key];
          const base = {
            id: p.productId || key, name: p.name || 'Unnamed', category: p.category || 'Other',
            description: p.description || '', negociable: p.negotiable || false, verified: p.verified || false,
            price: parseFloat(p.price)||0, images: [], timestamp: p.timestamp || new Date().toISOString(),
            shopId: p.shopId || '', shopName: p.shopName || '', shopPhone: p.shopPhone || '', shopLocation: p.shopLocation || ''
          };
          if (p.image1) base.images.push(p.image1);
          if (p.image2) base.images.push(p.image2);
          if (p.image3) base.images.push(p.image3);
          if ((!base.shopName || !base.shopPhone) && base.shopId) {
            const shop = shops.find(s => s.id === base.shopId);
            if (shop) { base.shopName = shop.name; base.shopPhone = shop.phone; base.shopLocation = shop.location; }
          }
          return base;
        });
        allProducts = [...products];
        products.sort((a,b) => (a.verified === b.verified) ? new Date(b.timestamp)-new Date(a.timestamp) : a.verified ? -1 : 1);
        populateCategories();
        loadingSpinner.style.display = 'none';
        productGrid.style.display = 'grid';
        renderProducts(products);
      }, (err) => {
        loadingSpinner.style.display = 'none';
        productGrid.style.display = 'grid';
        productGrid.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>${t('errorLoading')}</h3></div>`;
      });
    }

    function populateCategories() {
      const cats = ['all', ...new Set(products.map(p => p.category).filter(Boolean))];
      const dc = document.getElementById('categoryDropdownContent');
      dc.innerHTML = cats.map(c => c === 'all' ? `<a data-category="all">${t('allCategories')}</a>` : `<a data-category="${c}">${c}</a>`).join('');
      dc.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', (e) => {
          e.stopPropagation(); selectedCategory = link.dataset.category;
          document.getElementById('categoryDropdownBtn').querySelector('span').textContent = selectedCategory === 'all' ? t('allCategories') : selectedCategory;
          filterProducts();
        });
      });
    }

    function renderProducts(list) {
      if (!list.length) { productGrid.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><h3>${t('noMatch')}</h3></div>`; return; }
      productGrid.innerHTML = list.map(prod => {
        const img = prod.images?.[0] || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&auto=format';
        const negotiableHtml = prod.negociable ? '<span class="negotiable-badge">Negotiable</span>' : '<span class="negotiable-badge" style="background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.5);">Fixed</span>';
        const verifiedBadge = prod.verified ? '<div class="verified-badge-image"><i class="fas fa-check-circle"></i> Verified</div>' : '';
        return `
          <div class="product-card" data-id="${prod.id}">
            <div class="image-container">
              <img class="product-img" src="${img}" alt="${prod.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&auto=format'">
              ${verifiedBadge}
              <button class="cart-image-btn" onclick="addToCart('${prod.id}', event)"><i class="fas fa-shopping-cart"></i> Add</button>
            </div>
            <div class="product-info">
              <h3>${prod.name}</h3>
              <div class="product-desc">${prod.description || t('noDescription')}</div>
              <div class="price-section"><span class="product-price">${Number(prod.price).toLocaleString()} RWF</span>${negotiableHtml}</div>
            </div>
            <div class="seller-info-card">
              <div class="seller-name-card"><i class="fas fa-store"></i> ${prod.shopName || t('unknownShop')}</div>
            </div>
          </div>
        `;
      }).join('');
      document.querySelectorAll('.product-card').forEach(card => {
        card.addEventListener('click', (e) => { if (!e.target.closest('button')) window.location.href = 'buy.html?id=' + card.dataset.id; });
      });
    }

    function filterProducts() {
      loadingSpinner.style.display = 'block';
      productGrid.style.display = 'none';
      setTimeout(() => {
        const term = searchInput.value.trim().toLowerCase();
        const min = minPriceInput.value ? parseFloat(minPriceInput.value) : 0;
        const max = maxPriceInput.value ? parseFloat(maxPriceInput.value) : Infinity;
        let filtered = allProducts.filter(p => {
          if (selectedCategory !== 'all' && p.category !== selectedCategory) return false;
          const price = parseFloat(p.price) || 0;
          if (price < min || price > max) return false;
          if (!term) return true;
          const haystack = (p.name + ' ' + p.description + ' ' + (p.shopName||'') + ' ' + (p.shopLocation||'')).toLowerCase();
          return haystack.includes(term);
        });
        filtered.sort((a,b) => (a.verified === b.verified) ? a.price - b.price : a.verified ? -1 : 1);
        loadingSpinner.style.display = 'none';
        productGrid.style.display = 'grid';
        renderProducts(filtered);
      }, 300);
    }

    function resetFilters() {
      loadingSpinner.style.display = 'block';
      productGrid.style.display = 'none';
      searchInput.value = ''; minPriceInput.value = ''; maxPriceInput.value = ''; selectedCategory = 'all';
      document.getElementById('categoryDropdownBtn').querySelector('span').textContent = t('allCategories');
      setTimeout(() => {
        const sorted = [...allProducts].sort((a,b) => (a.verified === b.verified) ? new Date(b.timestamp)-new Date(a.timestamp) : a.verified ? -1 : 1);
        loadingSpinner.style.display = 'none';
        productGrid.style.display = 'grid';
        renderProducts(sorted);
      }, 300);
    }

    async function handleLogout() {
      await signOut(auth); 
      showToast(t('loggedOut'), 'success'); 
      setTimeout(() => window.location.href = 'index.html', 1000);
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      await updateUserProfile(user);
      await loadUserCart();
    });

    cartIndicator.addEventListener('click', () => { window.location.href = 'profile.html'; });
    
    logoutBtn.addEventListener('click', async (e) => { 
      e.preventDefault();
      await handleLogout();
    });

    menuLogoutBtn.addEventListener('click', async () => {
      await handleLogout();
    });

    loadShops().then(fetchProducts);
    filterBtn.addEventListener('click', filterProducts);
    refreshBtn.addEventListener('click', resetFilters);
    searchInput.addEventListener('keyup', e => e.key === 'Enter' && filterProducts());
    minPriceInput.addEventListener('keyup', e => e.key === 'Enter' && filterProducts());
    maxPriceInput.addEventListener('keyup', e => e.key === 'Enter' && filterProducts());

    const modal = document.getElementById('contactModal');
    document.getElementById('helpCenterLink')?.addEventListener('click', (e) => { e.preventDefault(); modal.classList.add('active'); });
    document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.remove('active'));
    window.addEventListener('click', e => e.target === modal && modal.classList.remove('active'));
    document.getElementById('modalHelpCenter').addEventListener('click', (e) => { e.preventDefault(); showToast(t('faq'), 'warning'); });

    const langOptions = document.querySelectorAll('.lang-option');
    langOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        const lang = opt.dataset.lang;
        if (lang) { currentLang = lang; localStorage.setItem('guraneza_lang', currentLang); updateLanguage(); }
      });
    });

    const savedLang = localStorage.getItem('guraneza_lang') || 'en';
    currentLang = savedLang;
    updateLanguage();
  </script>
</body>
</html>
