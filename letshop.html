    /* Menu FAB */

    /* Header */

    .nav-item:hover { color: #FF6B35; } .nav-item:hover::after { width: 100%; }
    .nav-item i { font-size: 0.95rem; color: rgba(255, 255, 255, 0.6); } .nav-item:hover i { color: #FF6B35; }
    .header-actions { display: flex; align-items: center; gap: 1.5rem; flex: 1; justify-content: flex-end; }

    .user-dropdown:hover .user-dropdown-content { opacity: 1; visibility: visible; transform: translateY(0); }
    .user-dropdown-content a { display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 1.2rem; text-decoration: none; color: rgba(255, 255, 255, 0.85); font-size: 0.8rem; cursor: pointer; }
    .user-dropdown-content a i { width: 18px; color: #FF6B35; }
    .user-dropdown-content a:hover { background: rgba(255, 107, 53, 0.15); color: white; }

    /* Toast */
    .toast-container { position: fixed; top: 80px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(16px); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); padding: 10px 14px; min-width: 240px; transform: translateX(120%); transition: transform 0.25s ease; display: flex; align-items: center; gap: 10px; pointer-events: auto; border: 1px solid rgba(255, 107, 53, 0.2); }
    .toast.show { transform: translateX(0); }
    .toast-icon { width: 28px; height: 28px; border-radius: 8px; background: #FF6B35; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.8rem; }

    .toast-message { color: rgba(255, 255, 255, 0.7); font-size: 0.7rem; }
    .toast-close { color: rgba(255, 255, 255, 0.5); cursor: pointer; font-size: 0.8rem; }

    .container { width: 100%; padding: 1.2rem 2rem; }

    /* Loading Spinner */
    .loading-spinner { text-align: center; padding: 2rem; }
    .spinner { display: inline-block; width: 50px; height: 50px; border: 3px solid rgba(255, 107, 53, 0.1); border-radius: 50%; border-top-color: #FF6B35; animation: spin 0.8s ease infinite; box-shadow: 0 0 20px rgba(255, 107, 53, 0.3); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(6px); align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(16px); max-width: 400px; width: 90%; padding: 1.8rem; border-radius: 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255, 107, 53, 0.2); }
    .modal-content h3 { font-size: 1.3rem; background: linear-gradient(135deg, #FF6B35 0%, #ff8a5c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
    .close-modal { position: absolute; top: 0.8rem; right: 1rem; font-size: 1.6rem; cursor: pointer; color: rgba(255,255,255,0.5); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.03); }
    .close-modal:hover { background: rgba(255, 107, 53, 0.15); color: #FF6B35; }

    /* Shop Content */
    .shop-content { background: rgba(26, 26, 46, 0.35); backdrop-filter: blur(16px); border-radius: 20px; border: 1px solid rgba(255, 107, 53, 0.15); overflow: hidden; }
    .shop-header { position: relative; height: 240px; background-size: cover; background-position: center; }
    .shop-header::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.7)); }
    .shop-header-content { position: absolute; bottom: 1.2rem; left: 1.5rem; right: 1.5rem; color: white; display: flex; align-items: flex-end; justify-content: space-between; }

    .shop-header-meta { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
    .shop-header-category { display: flex; align-items: center; gap: 0.4rem; background: rgba(255,255,255,0.2); padding: 0.25rem 1rem; border-radius: 40px; backdrop-filter: blur(4px); font-size: 0.8rem; }
    .shop-header-verified { padding: 0.25rem 1rem; border-radius: 40px; font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem; background: #2ecc71; color: white; }
    .shop-header-unverified { padding: 0.25rem 1rem; border-radius: 40px; font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem; background: #f59e0b; color: #1a1a2e; }
    .shop-header-stats { display: flex; gap: 1.5rem; background: rgba(255,255,255,0.2); backdrop-filter: blur(4px); padding: 0.5rem 1.2rem; border-radius: 50px; }
    .shop-header-stat { text-align: center; } .shop-header-stat-value { font-weight: 700; font-size: 1rem; } .shop-header-stat-label { font-size: 0.65rem; opacity: 0.9; }
    .shop-details { padding: 1.2rem 1.5rem; background: rgba(0,0,0,0.1); border-bottom: 1px solid rgba(255, 107, 53, 0.1); display: grid; grid-template-columns: repeat(4,1fr); gap: 1rem; }
    .shop-detail-item { display: flex; align-items: center; gap: 0.6rem; }
    .shop-detail-item i { width: 36px; height: 36px; background: rgba(255, 107, 53, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #FF6B35; }
    .shop-detail-content { flex: 1; } .shop-detail-label { font-size: 0.6rem; color: rgba(255,255,255,0.5); text-transform: uppercase; } .shop-detail-value { font-weight: 600; color: white; font-size: 0.8rem; }
    .shop-description { padding: 1.5rem; border-bottom: 1px solid rgba(255, 107, 53, 0.1); }
    .shop-description h3 { color: #FF6B35; margin-bottom: 0.6rem; font-size: 1rem; }
    .shop-description p { color: rgba(255,255,255,0.7); line-height: 1.6; font-size: 0.9rem; }

    .filter-section { position: sticky; top: 62px; z-index: 95; background: rgba(26, 26, 46, 0.4); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 107, 53, 0.15); }
    .filter-bar { padding: 0.8rem 1.5rem; display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
    .filter-group { flex: 1; min-width: 150px; }
    .filter-input { width: 100%; padding: 0.6rem 1rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255, 107, 53, 0.2); border-radius: 40px; font-size: 0.85rem; color: white; outline: none; }
    .filter-input:focus { border-color: #FF6B35; }
    .filter-input::placeholder { color: rgba(255,255,255,0.4); }
    .filter-select { width: 100%; padding: 0.6rem 1rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255, 107, 53, 0.2); border-radius: 40px; font-size: 0.85rem; color: white; outline: none; appearance: none; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23FF6B35" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>'); background-repeat: no-repeat; background-position: right 1rem center; background-size: 0.8rem; cursor: pointer; }
    .filter-select option { background: #1a1a2e; color: white; }
    .price-range-container { display: flex; align-items: center; gap: 0.3rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255, 107, 53, 0.2); border-radius: 40px; padding: 0.2rem 0.5rem; }
    .price-range-input { width: 80px; padding: 0.4rem 0.6rem; border: none; background: transparent; font-size: 0.85rem; color: white; text-align: center; outline: none; }
    .price-range-input::placeholder { color: rgba(255,255,255,0.4); }
    .price-range-separator { color: rgba(255,255,255,0.4); }
    .filter-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .filter-icon-btn { width: 40px; height: 40px; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #FF6B35; color: white; transition: 0.15s; }
    .filter-icon-btn:hover { background: #ff7a4a; }
    .reset-icon-btn { width: 40px; height: 40px; border: 1px solid rgba(255, 107, 53, 0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; background: transparent; color: #FF6B35; transition: 0.15s; }
    .reset-icon-btn:hover { background: rgba(255, 107, 53, 0.1); }
    .filter-results-info { padding: 0.5rem 1.5rem; background: rgba(0,0,0,0.1); border-bottom: 1px solid rgba(255, 107, 53, 0.1); color: rgba(255,255,255,0.6); font-size: 0.8rem; }

    .products-section { padding: 1.5rem; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    .product-card { background: rgba(0,0,0,0.15); border-radius: 16px; border: 1px solid rgba(255, 107, 53, 0.1); overflow: hidden; transition: all 0.2s; cursor: pointer; }
    .product-card:hover { transform: translateY(-3px); border-color: rgba(255, 107, 53, 0.3); }

    .product-card-badge { position: absolute; top: 0.6rem; right: 0.6rem; background: #2ecc71; color: white; padding: 0.2rem 0.8rem; border-radius: 30px; font-size: 0.65rem; display: flex; align-items: center; gap: 0.2rem; }
    .product-card-badge.unverified { background: #f59e0b; color: #1a1a2e; }
    .product-card-content { padding: 0.8rem; }
    .product-card-name { font-weight: 600; color: white; margin-bottom: 0.2rem; font-size: 0.9rem; }

    .product-card-price { font-weight: 700; color: #FF6B35; font-size: 1rem; margin-bottom: 0.4rem; }
    .product-card-negotiable { display: inline-block; background: rgba(255, 107, 53, 0.15); color: #FF6B35; padding: 0.15rem 0.6rem; border-radius: 30px; font-size: 0.6rem; font-weight: 600; }
    .product-card-actions { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
    .product-card-btn { flex: 1; padding: 0.4rem; border: none; border-radius: 30px; font-size: 0.7rem; font-weight: 500; cursor: pointer; transition: 0.15s; display: flex; align-items: center; justify-content: center; gap: 0.3rem; }
    .product-card-btn.chat { background: #FF6B35; color: white; }
    .product-card-btn.chat:hover { background: #ff7a4a; }
    .product-card-btn.cart { background: rgba(255, 107, 53, 0.15); color: #FF6B35; border: 1px solid rgba(255, 107, 53, 0.3); }
    .product-card-btn.cart:hover { background: rgba(255, 107, 53, 0.25); }
    .no-results { text-align: center; padding: 2.5rem; color: rgba(255,255,255,0.5); grid-column: 1/-1; }
    .no-results i { font-size: 2.5rem; color: rgba(255, 107, 53, 0.3); margin-bottom: 0.5rem; }
    .error-state { text-align: center; padding: 3rem; background: rgba(26, 26, 46, 0.3); backdrop-filter: blur(16px); border-radius: 20px; }

    footer { background: rgba(26, 26, 46, 0.35); backdrop-filter: blur(16px); margin-top: 2.5rem; padding: 1.5rem 2rem 0.8rem; border-radius: 24px 24px 0 0; border-top: 1px solid rgba(255, 107, 53, 0.12); }
    .footer-content { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; color: white; }
    .footer-brand { display: flex; align-items: center; gap: 0.5rem; } .footer-brand img { width: 28px; height: 28px; object-fit: contain; } .footer-brand p { font-size: 0.85rem; font-weight: 500; }
    .social-only { display: flex; gap: 1rem; } .social-only a { font-size: 1.3rem; color: rgba(255, 255, 255, 0.6); transition: all 0.2s ease; }
    .social-only a:hover { color: #FF6B35; transform: translateY(-2px); }
    .copyright { width: 100%; text-align: center; font-size: 0.65rem; color: rgba(255, 255, 255, 0.4); margin-top: 1.2rem; padding-top: 0.8rem; border-top: 1px solid rgba(255, 107, 53, 0.1); }

    @media (max-width: 900px) { .shop-details { grid-template-columns: repeat(2,1fr); } .filter-bar { flex-direction: column; align-items: stretch; } }
    @media (max-width: 768px) { .nav-container { flex-wrap: wrap; } .nav-links { order: 3; width: 100%; justify-content: center; margin-top: 0.5rem; } .shop-header-content { flex-direction: column; align-items: flex-start; gap: 0.5rem; } }
  </style>

  <header class="sticky-nav">
    <div class="nav-container"><div class="logo-area"><img src="gn.png" alt="GuraNeza" class="logo-icon-img"><div class="logo-text">GuraNeza <span>| BuySmart</span></div></div>
      <div class="nav-links"><a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a><a href="buy.html" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Buy</span></a><a href="sell.html" class="nav-item"><i class="fas fa-plus-circle"></i><span>Sell</span></a><a href="shops.html" class="nav-item"><i class="fas fa-store"></i><span>Shops</span></a></div>
      <div class="header-actions"><div class="cart-indicator" id="cartIndicator" onclick="window.location.href='profile.html'"><i class="fas fa-shopping-basket"></i> <span>Cart</span> <span class="cart-badge" id="cartCount">0</span></div><div class="lang-switch"><span class="lang-option" data-lang="en">EN</span><span class="lang-option" data-lang="fr">FR</span><span class="lang-option" data-lang="rw">RW</span></div><div class="user-dropdown"><div class="user-profile" id="userProfile"><div class="user-avatar" id="userAvatar"><i class="fas fa-user-circle"></i></div><span class="user-name" id="userName">Guest</span></div><div class="user-dropdown-content"><a href="profile.html"><i class="fas fa-user"></i> Profile</a><a href="#" id="logoutBtn" style="display: none;"><i class="fas fa-sign-out-alt"></i> Logout</a><a href="login.html" id="loginDropdownBtn"><i class="fas fa-sign-in-alt"></i> Login</a></div></div></div>
    </div>
  </header>

  <div id="toastContainer" class="toast-container"></div>

  <main class="container">
    <div id="loadingSpinner" class="loading-spinner" style="display:none;"><div class="spinner"></div><p style="margin-top:0.5rem;">Loading...</p></div>
    <div id="mainContent"></div>
  </main>

  <footer><div class="footer-content"><div class="footer-brand"><img src="gn.png" alt="GuraNeza"><p>© 2026 GuraNeza | BuySmart</p></div><div class="social-only"><a href="#"><i class="fab fa-tiktok"></i></a><a href="#"><i class="fab fa-youtube"></i></a><a href="#"><i class="fab fa-instagram"></i></a><a href="#"><i class="fab fa-x-twitter"></i></a></div></div><div class="copyright">Buy Smart, Sell Easy · @guraneza</div></footer>

  <script>document.addEventListener('DOMContentLoaded',function(){const a=document.getElementById('menuFabMain'),b=document.getElementById('menuFabPopup');a.addEventListener('click',function(e){e.stopPropagation();b.classList.toggle('active');a.classList.toggle('active')});document.addEventListener('click',function(e){if(!a.contains(e.target)&&!b.contains(e.target)){b.classList.remove('active');a.classList.remove('active')}})});</script>

  <script type="module">
    // ===== EXACT SAME WORKING CODE FROM ORIGINAL LETSHOP =====
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyAr6-rTa8yQCxr41JjWysFLHeFxH0C2IMI", authDomain: "guraneza-714f7.firebaseapp.com", databaseURL: "https://guraneza-714f7-default-rtdb.firebaseio.com", projectId: "guraneza-714f7", storageBucket: "guraneza-714f7.firebasestorage.app", messagingSenderId: "457107620336", appId: "1:457107620336:web:1583db305b03528fcf5d35" };
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    let currentUser = null, userProfile = null, currentShop = null, shopProducts = [], filteredProducts = [];
    let filterState = { searchTerm: '', category: 'all', minPrice: '', maxPrice: '' };
    const mainContent = document.getElementById('mainContent');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const cartCount = document.getElementById('cartCount');
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginDropdownBtn = document.getElementById('loginDropdownBtn');
    const menuLogoutBtn = document.getElementById('menuLogoutBtn');

    function showToast(m, t = 'success') { const c = document.getElementById('toastContainer'), d = document.createElement('div'); d.className = `toast ${t}`; d.innerHTML = `<div class="toast-icon"><i class="fas fa-${t==='success'?'check':'exclamation'}-circle"></i></div><div class="toast-content"><div class="toast-title">${t}</div><div class="toast-message">${m}</div></div><div class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></div>`; c.appendChild(d); setTimeout(() => d.classList.add('show'), 10); setTimeout(() => { d.classList.remove('show'); setTimeout(() => d.remove(), 200); }, 3000); }
    function setLoading(v) { loadingSpinner.style.display = v ? 'block' : 'none'; }
    function getShopId() { return new URLSearchParams(window.location.search).get('shop'); }

    async function updateProfile(user) {
      if (user) { try { const s = await get(ref(database, `users/${user.uid}`)); if (s.exists()) userProfile = s.val(); else userProfile = { uid: user.uid, email: user.email, displayName: user.email?.split('@')[0] || 'Guest' }; userName.textContent = userProfile.displayName || user.email?.split('@')[0] || 'User'; if (userProfile.profileImage) userAvatar.innerHTML = `<img src="${userProfile.profileImage}" alt="">`; logoutBtn.style.display = 'flex'; loginDropdownBtn.style.display = 'none'; if (menuLogoutBtn) menuLogoutBtn.style.display = 'flex'; } catch { userName.textContent = user.email?.split('@')[0] || 'User'; logoutBtn.style.display = 'flex'; loginDropdownBtn.style.display = 'none'; } }
      else { userName.textContent = 'Guest'; userAvatar.innerHTML = '<i class="fas fa-user-circle"></i>'; logoutBtn.style.display = 'none'; loginDropdownBtn.style.display = 'flex'; if (menuLogoutBtn) menuLogoutBtn.style.display = 'none'; }
    }

    async function loadCart() { if (!currentUser) { cartCount.textContent = '0'; return; } try { const s = await get(ref(database, `carts/${currentUser.uid}`)); cartCount.textContent = s.exists() ? Object.keys(s.val()).length : '0'; } catch { cartCount.textContent = '0'; } }

    // ===== EXACT SAME loadShopData from original =====
    async function loadShopData() {
      let shopId = getShopId();
      if (!shopId) { shopId = localStorage.getItem('lastViewedShop'); if (shopId) { const url = new URL(window.location); url.searchParams.set('shop', shopId); window.history.replaceState({}, '', url); } }
      if (!shopId) { mainContent.innerHTML = `<div class="error-state"><i class="fas fa-store-slash"></i><h2>No Shop Selected</h2><a href="shops.html" style="color:#FF6B35;">Go to Shops</a></div>`; return; }
      setLoading(true);
      try {
        const snap = await get(ref(database, 'shops'));
        if (snap.exists()) { const shops = snap.val(); let found = null; for (const k in shops) { const s = shops[k]; if (s.shopId === shopId || k === shopId) { found = { firebaseKey: k, id: s.shopId || k, name: s.name || '', description: s.description || '', category: s.category || '', location: s.location || '', contact: s.contact || { phone: '', email: '' }, tin: s.tin || '', verified: s.verified || false, posterImage: s.posterImage || '', createdBy: s.createdBy || '', createdByEmail: s.createdByEmail || '' }; break; } }
          if (found) { currentShop = found; localStorage.setItem('lastViewedShop', shopId); await loadShopProducts(); filteredProducts = [...shopProducts]; renderShopPage(); }
          else { localStorage.removeItem('lastViewedShop'); mainContent.innerHTML = `<div class="error-state"><i class="fas fa-exclamation-circle"></i><h2>Shop Not Found</h2><a href="shops.html" style="color:#FF6B35;">Go to Shops</a></div>`; }
        } else { mainContent.innerHTML = `<div class="error-state"><i class="fas fa-store-slash"></i><h2>No Shops</h2></div>`; }
      } catch (e) { mainContent.innerHTML = `<div class="error-state"><i class="fas fa-exclamation-triangle"></i><h2>Error Loading Shop</h2></div>`; } finally { setLoading(false); }
    }

    // ===== EXACT SAME loadShopProducts from original =====
    async function loadShopProducts() {
      if (!currentShop) return;
      try { const snap = await get(ref(database, 'products')); if (snap.exists()) { shopProducts = []; for (const k in snap.val()) { const p = snap.val()[k]; if (p.shopId === currentShop.id) { const imgs = []; if (p.image1) imgs.push(p.image1); if (p.image2) imgs.push(p.image2); if (p.image3) imgs.push(p.image3); shopProducts.push({ firebaseKey: k, id: p.productId || k, name: p.name || '', category: p.category || '', description: p.description || '', negociable: p.negotiable || false, verified: p.verified || false, price: p.price || 0, images: imgs, shopId: p.shopId, shopName: p.shopName || currentShop.name, shopPhone: p.shopPhone || currentShop.contact.phone, shopLocation: p.shopLocation || currentShop.location }); } } } } catch (e) {}
    }

    // ===== EXACT SAME addToCart from original =====
    window.addToCart = async function(productId, event) {
      if (event) event.stopPropagation();
      const product = shopProducts.find(p => p.id === productId);
      if (!product) { showToast('Product not found', 'error'); return; }
      if (!currentUser) { showToast('Please log in first', 'warning'); setTimeout(() => window.location.href = 'index.html', 1500); return; }
      try {
        const userCartRef = ref(database, `carts/${currentUser.uid}`); const snap = await get(userCartRef); let exists = false;
        if (snap.exists()) { for (const [key, item] of Object.entries(snap.val())) { if (item.id === productId) { exists = true; break; } } }
        if (!exists) {
          const cartItem = { id: product.id, name: product.name, price: parseFloat(product.price) || 0, addedAt: new Date().toISOString(), category: product.category || '', description: product.description || '', shopId: product.shopId || '', shopName: product.shopName || '', shopPhone: product.shopPhone || '', shopLocation: product.shopLocation || '', verified: product.verified || false, negociable: product.negociable || false };
          if (product.images?.length) { cartItem.images = {}; product.images.forEach((img, i) => { if (img) cartItem.images[`image${i + 1}`] = img; }); }
          await set(push(userCartRef), cartItem); await loadCart(); showToast(`${product.name} added to cart`);
        } else { showToast(`${product.name} already in cart`, 'warning'); }
      } catch (e) { showToast('Error adding to cart', 'error'); }
    };

    // ===== EXACT SAME filters from original =====
    window.applyFilters = function() {
      const searchInput = document.getElementById('searchInput'), categorySelect = document.getElementById('categorySelect'), minPrice = document.getElementById('minPrice'), maxPrice = document.getElementById('maxPrice');
      filterState = { searchTerm: searchInput?.value || '', category: categorySelect?.value || 'all', minPrice: minPrice?.value || '', maxPrice: maxPrice?.value || '' };
      filteredProducts = shopProducts.filter(p => {
        const ms = filterState.searchTerm === '' || p.name.toLowerCase().includes(filterState.searchTerm.toLowerCase()) || p.description.toLowerCase().includes(filterState.searchTerm.toLowerCase());
        const mc = filterState.category === 'all' || p.category === filterState.category;
        let mpr = true; const pr = parseFloat(p.price) || 0;
        if (filterState.minPrice !== '' && filterState.maxPrice !== '') mpr = pr >= parseFloat(filterState.minPrice) && pr <= parseFloat(filterState.maxPrice);
        else if (filterState.minPrice !== '') mpr = pr >= parseFloat(filterState.minPrice);
        else if (filterState.maxPrice !== '') mpr = pr <= parseFloat(filterState.maxPrice);
        return ms && mc && mpr;
      }); renderProducts(); updateResultsCount();
    };

    window.resetFilters = function() {
      filterState = { searchTerm: '', category: 'all', minPrice: '', maxPrice: '' }; filteredProducts = [...shopProducts];
      const searchInput = document.getElementById('searchInput'), categorySelect = document.getElementById('categorySelect'), minPrice = document.getElementById('minPrice'), maxPrice = document.getElementById('maxPrice');
      if (searchInput) searchInput.value = ''; if (categorySelect) categorySelect.value = 'all'; if (minPrice) minPrice.value = ''; if (maxPrice) maxPrice.value = '';
      renderProducts(); updateResultsCount();
    };

    function updateResultsCount() { const rc = document.getElementById('resultsCount'); if (rc) rc.textContent = `Showing ${filteredProducts.length} of ${shopProducts.length} products`; }

    window.goToProductDetail = (id) => window.location.href = `buy.html?id=${id}`;
    window.goToBuyChat = (id) => window.location.href = `buy.html?id=${id}`;

    // ===== EXACT SAME renderShopPage from original =====
    function renderShopPage() {
      const productCount = shopProducts.length, verifiedCount = shopProducts.filter(p => p.verified).length;
      const categories = ['all', ...new Set(shopProducts.map(p => p.category).filter(Boolean))];
      mainContent.innerHTML = `<div class="shop-content"><div class="shop-header" style="background-image: url('${currentShop.posterImage || 'https://images.unsplash.com/photo-1557683311-eac922347aa1?w=1200&auto=format'}')"><div class="shop-header-content"><div class="shop-header-info"><h1>${currentShop.name}</h1><div class="shop-header-meta"><span class="shop-header-category"><i class="fas fa-folder"></i> ${currentShop.category}</span>${currentShop.verified ? '<span class="shop-header-verified"><i class="fas fa-check-circle"></i> Verified</span>' : '<span class="shop-header-unverified"><i class="fas fa-times-circle"></i> Unverified</span>'}</div></div><div class="shop-header-stats"><div class="shop-header-stat"><div class="shop-header-stat-value">${productCount}</div><div class="shop-header-stat-label">Products</div></div><div class="shop-header-stat"><div class="shop-header-stat-value">${verifiedCount}</div><div class="shop-header-stat-label">Verified</div></div></div></div></div><div class="shop-details"><div class="shop-detail-item"><i class="fas fa-map-marker-alt"></i><div class="shop-detail-content"><div class="shop-detail-label">Location</div><div class="shop-detail-value">${currentShop.location}</div></div></div><div class="shop-detail-item"><i class="fas fa-phone"></i><div class="shop-detail-content"><div class="shop-detail-label">Phone</div><div class="shop-detail-value">${currentShop.contact.phone}</div></div></div><div class="shop-detail-item"><i class="fas fa-envelope"></i><div class="shop-detail-content"><div class="shop-detail-label">Email</div><div class="shop-detail-value">${currentShop.contact.email}</div></div></div><div class="shop-detail-item"><i class="fas fa-id-card"></i><div class="shop-detail-content"><div class="shop-detail-label">TIN</div><div class="shop-detail-value">${currentShop.tin}</div></div></div></div><div class="shop-description"><h3><i class="fas fa-store"></i> About</h3><p>${currentShop.description}</p></div><div class="filter-section"><div class="filter-bar"><div class="filter-group"><input type="text" class="filter-input" id="searchInput" placeholder="Search products..." value="${filterState.searchTerm}"></div><div class="filter-group"><select class="filter-select" id="categorySelect">${categories.map(c => `<option value="${c}" ${filterState.category === c ? 'selected' : ''}>${c === 'all' ? 'All Categories' : c}</option>`).join('')}</select></div><div class="filter-group"><div class="price-range-container"><input type="number" class="price-range-input" id="minPrice" placeholder="Min" value="${filterState.minPrice}"><span class="price-range-separator">-</span><input type="number" class="price-range-input" id="maxPrice" placeholder="Max" value="${filterState.maxPrice}"></div></div><div class="filter-actions"><button class="filter-icon-btn" onclick="applyFilters()" title="Apply"><i class="fas fa-filter"></i></button><button class="reset-icon-btn" onclick="resetFilters()" title="Reset"><i class="fas fa-undo-alt"></i></button></div></div><div class="filter-results-info"><i class="fas fa-box"></i><span id="resultsCount">Showing ${filteredProducts.length} of ${shopProducts.length} products</span></div></div><div class="products-section"><div class="products-grid" id="productsGrid"></div></div></div>`;
      renderProducts();
      document.getElementById('searchInput')?.addEventListener('input', applyFilters);
      document.getElementById('categorySelect')?.addEventListener('change', applyFilters);
      document.getElementById('minPrice')?.addEventListener('input', applyFilters);
      document.getElementById('maxPrice')?.addEventListener('input', applyFilters);
    }

    // ===== EXACT SAME renderProducts from original =====
    function renderProducts() {
      const grid = document.getElementById('productsGrid'); if (!grid) return;
      if (filteredProducts.length === 0) { grid.innerHTML = `<div class="no-results"><i class="fas fa-search"></i><h3>No products found</h3><p>Try adjusting filters</p></div>`; return; }
      grid.innerHTML = filteredProducts.map(p => `<div class="product-card" onclick="goToProductDetail('${p.id}')"><div class="product-card-image" style="background-image:url('${p.images?.[0] || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&auto=format'}')">${p.verified ? '<span class="product-card-badge"><i class="fas fa-check-circle"></i> Verified</span>' : '<span class="product-card-badge unverified"><i class="fas fa-times-circle"></i> Unverified</span>'}</div><div class="product-card-content"><div class="product-card-name">${p.name}</div><div class="product-card-desc">${(p.description || '').substring(0, 60)}${p.description.length > 60 ? '...' : ''}</div><div class="product-card-price">${p.price.toLocaleString()} RWF</div>${p.negociable ? '<span class="product-card-negotiable"><i class="fas fa-handshake"></i> Negotiable</span>' : ''}<div class="product-card-actions"><button class="product-card-btn chat" onclick="event.stopPropagation(); goToBuyChat('${p.id}')"><i class="fas fa-comment"></i> Chat</button><button class="product-card-btn cart" onclick="event.stopPropagation(); addToCart('${p.id}', event)"><i class="fas fa-shopping-cart"></i> Cart</button></div></div></div>`).join('');
    }

    onAuthStateChanged(auth, async (user) => { currentUser = user; await updateProfile(user); await loadCart(); loadShopData(); });
    logoutBtn.addEventListener('click', async (e) => { e.preventDefault(); await signOut(auth); showToast('Logged out', 'success'); setTimeout(()=>window.location.href='index.html',1000); });
    if (menuLogoutBtn) menuLogoutBtn.addEventListener('click', async () => { await signOut(auth); showToast('Logged out', 'success'); setTimeout(()=>window.location.href='index.html',1000); });
    document.getElementById('closeModalBtn')?.addEventListener('click', () => document.getElementById('contactModal').classList.remove('active'));
    window.addEventListener('click', e => { if (e.target === document.getElementById('contactModal')) document.getElementById('contactModal').classList.remove('active'); });
    document.querySelectorAll('.lang-option').forEach(o => { let l = localStorage.getItem('guraneza_lang')||'en'; o.classList.toggle('active', o.dataset.lang===l); o.addEventListener('click', () => { localStorage.setItem('guraneza_lang', o.dataset.lang); document.querySelectorAll('.lang-option').forEach(x => x.classList.toggle('active', x.dataset.lang===o.dataset.lang)); }); });
  </script>
</body>
