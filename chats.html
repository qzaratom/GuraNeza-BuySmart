    <div class="chat-panel" id="chatPanel"><div class="loading-spinner"><div class="spinner"></div><p style="margin-top:0.8rem;color:rgba(255,255,255,0.7);">Loading chats...</p></div></div>
  </main>

  <footer><div class="footer-content"><div class="footer-brand"><img src="gn.png" alt="GuraNeza"><p>© 2026 GuraNeza | BuySmart</p></div><div class="social-only"><a href="#"><i class="fab fa-tiktok"></i></a><a href="#"><i class="fab fa-youtube"></i></a><a href="#"><i class="fab fa-instagram"></i></a><a href="#"><i class="fab fa-x-twitter"></i></a></div></div><div class="copyright">Buy Smart, Sell Easy · @guraneza</div></footer>

  <script>document.addEventListener('DOMContentLoaded',function(){const a=document.getElementById('menuFabMain'),b=document.getElementById('menuFabPopup');a.addEventListener('click',function(e){e.stopPropagation();b.classList.toggle('active');a.classList.toggle('active')});document.addEventListener('click',function(e){if(!a.contains(e.target)&&!b.contains(e.target)){b.classList.remove('active');a.classList.remove('active')}})});</script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyAr6-rTa8yQCxr41JjWysFLHeFxH0C2IMI", authDomain: "guraneza-714f7.firebaseapp.com", databaseURL: "https://guraneza-714f7-default-rtdb.firebaseio.com", projectId: "guraneza-714f7", storageBucket: "guraneza-714f7.firebasestorage.app", messagingSenderId: "457107620336", appId: "1:457107620336:web:1583db305b03528fcf5d35" };
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    let currentUser = null, currentChatPartner = null, currentProductContext = null, messagesListener = null, pendingDeleteContact = null;
    const chatPanel = document.getElementById('chatPanel'), cartCount = document.getElementById('cartCount'), userAvatar = document.getElementById('userAvatar'), userName = document.getElementById('userName');
    const logoutBtn = document.getElementById('logoutBtn'), loginDropdownBtn = document.getElementById('loginDropdownBtn'), menuLogoutBtn = document.getElementById('menuLogoutBtn');
    const userProfilesCache = new Map();

    function showToast(m, t = 'success') { const c = document.getElementById('toastContainer'), d = document.createElement('div'); d.className = `toast ${t}`; d.innerHTML = `<div class="toast-icon"><i class="fas fa-${t==='success'?'check':'exclamation'}-circle"></i></div><div class="toast-content"><div class="toast-title">${t}</div><div class="toast-message">${m}</div></div><div class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></div>`; c.appendChild(d); setTimeout(() => d.classList.add('show'), 10); setTimeout(() => { d.classList.remove('show'); setTimeout(() => d.remove(), 200); }, 3000); }
    async function loadCart() { if (!currentUser) { cartCount.textContent = '0'; return; } try { const s = await get(ref(database, `carts/${currentUser.uid}`)); cartCount.textContent = s.exists() ? Object.keys(s.val()).length : '0'; } catch { cartCount.textContent = '0'; } }
    async function updateProfile(user) { if (user) { try { const s = await get(ref(database, `users/${user.uid}`)); if (s.exists()) { const p = s.val(); userName.textContent = p.displayName || user.email?.split('@')[0] || 'User'; if (p.profileImage) userAvatar.innerHTML = `<img src="${p.profileImage}" alt="">`; } logoutBtn.style.display = 'flex'; loginDropdownBtn.style.display = 'none'; if (menuLogoutBtn) menuLogoutBtn.style.display = 'flex'; } catch { userName.textContent = user.email?.split('@')[0] || 'User'; logoutBtn.style.display = 'flex'; loginDropdownBtn.style.display = 'none'; } } else { userName.textContent = 'Guest'; logoutBtn.style.display = 'none'; loginDropdownBtn.style.display = 'flex'; if (menuLogoutBtn) menuLogoutBtn.style.display = 'none'; } }
    async function loadUserProfileImage(email) { if (userProfilesCache.has(email)) return userProfilesCache.get(email); try { const s = await get(ref(database, 'users')); if (s.exists()) { for (const k in s.val()) { if (s.val()[k].email === email) { userProfilesCache.set(email, s.val()[k]); return s.val()[k]; } } } } catch (e) {} return null; }
    function formatTime(ts) { const d = new Date(ts), n = new Date(); return (n - d < 86400000) ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString([], { month: 'short', day: 'numeric' }); }

    const stored = sessionStorage.getItem('chatProduct');
    if (stored) { currentProductContext = JSON.parse(stored); sessionStorage.removeItem('chatProduct'); }

    // 🔥 FIXED: Single send function - sends one message only
    let sendBtnListenerAttached = false;

    async function handleSendMessage() {
      const input = document.getElementById('messageInput');
      const message = input?.value.trim();
      if (!message || !currentChatPartner || !currentUser) return;
      try {
        const newMsg = { sender: currentUser.email, receiver: currentChatPartner, message, timestamp: new Date().toISOString(), productId: currentProductContext?.id || '', productName: currentProductContext?.name || 'Chat', read: false };
        await set(push(ref(database, 'chats')), newMsg);
        input.value = '';
        input.focus();
      } catch (e) { showToast('Error sending message', 'error'); }
    }

    // Attach send button listener ONCE
    function attachSendListener() {
      const sendBtn = document.getElementById('chatSendBtn');
      const msgInput = document.getElementById('messageInput');
      if (sendBtn && !sendBtnListenerAttached) {
        sendBtn.addEventListener('click', handleSendMessage);
        sendBtnListenerAttached = true;
      }
      if (msgInput) {
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); handleSendMessage(); } });
      }
    }

    // Reset listener flag when contact changes
    function selectContact(u) {
      currentChatPartner = u;
      sendBtnListenerAttached = false;
      document.getElementById('messagesArea').innerHTML = renderMessagesArea();
      loadMessages();
      markMessagesAsRead(u);
      setTimeout(attachSendListener, 300);
    }

    function filterContacts() {
      const t = document.getElementById('contactSearch')?.value.toLowerCase() || '';
      document.querySelectorAll('.contact-item').forEach(i => { const n = i.querySelector('.contact-name')?.textContent.toLowerCase() || ''; i.style.display = n.includes(t) ? 'flex' : 'none'; });
    }

    window.confirmDeleteChat = function(contactUsername) { pendingDeleteContact = contactUsername; document.getElementById('confirmDeleteModal').classList.add('active'); };
    window.cancelDeleteChat = function() { pendingDeleteContact = null; document.getElementById('confirmDeleteModal').classList.remove('active'); };

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('confirmDeleteBtn')?.addEventListener('click', async function() {
        if (!pendingDeleteContact || !currentUser) { document.getElementById('confirmDeleteModal').classList.remove('active'); return; }
        try {
          const snapshot = await get(ref(database, 'chats'));
          if (snapshot.exists()) { const data = snapshot.val(); const dp = []; for (const k in data) { const c = data[k]; if ((c.sender === currentUser.email && c.receiver === pendingDeleteContact) || (c.sender === pendingDeleteContact && c.receiver === currentUser.email)) dp.push(remove(ref(database, `chats/${k}`))); } await Promise.all(dp); showToast('Conversation deleted'); if (currentChatPartner === pendingDeleteContact) { currentChatPartner = null; sendBtnListenerAttached = false; } }
        } catch (e) { showToast('Error deleting', 'error'); }
        document.getElementById('confirmDeleteModal').classList.remove('active'); pendingDeleteContact = null;
      });
      document.getElementById('cancelDeleteBtn')?.addEventListener('click', window.cancelDeleteChat);
      document.getElementById('confirmDeleteModal')?.addEventListener('click', function(e) { if (e.target === this) window.cancelDeleteChat(); });
    });

    function loadAllChats() {
      if (!currentUser) { chatPanel.innerHTML = `<div class="no-contact-selected"><i class="fas fa-comments"></i><p>Please log in to view chats</p><button class="start-chat-btn" onclick="window.location.href='login.html'"><i class="fas fa-sign-in-alt"></i> Login</button></div>`; return; }
      onValue(ref(database, 'chats'), async (snap) => {
        if (!snap.exists()) { renderChatPanel([]); return; }
        const chats = snap.val(), ue = currentUser.email, rc = [];
        for (const k in chats) { const c = chats[k]; if (c.sender === ue || c.receiver === ue) rc.push(c); }
        const cm = new Map();
        for (const c of rc) { const o = c.sender === ue ? c.receiver : c.sender; const p = await loadUserProfileImage(o);
          if (!cm.has(o)) cm.set(o, { username: o, lastMessage: c.message, timestamp: c.timestamp, productName: c.productName || 'Chat', productId: c.productId, unread: (c.receiver === ue && !c.read), profileImage: p?.profileImage || '' });
          else { const ex = cm.get(o); if (new Date(c.timestamp) > new Date(ex.timestamp)) { ex.lastMessage = c.message; ex.timestamp = c.timestamp; ex.unread = (c.receiver === ue && !c.read); } }
        }
        const cc = Array.from(cm.values()).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        if (currentProductContext && currentUser) { const se = currentProductContext.seller; if (se && se !== currentUser.email) { if (!cc.find(c => c.username === se)) cc.unshift({ username: se, lastMessage: `Product: ${currentProductContext.name}`, timestamp: new Date().toISOString(), productName: currentProductContext.name, unread: false, profileImage: '' }); if (!currentChatPartner) currentChatPartner = se; } }
        renderChatPanel(cc);
      });
    }

    function renderChatPanel(cc) {
      chatPanel.innerHTML = `<div class="chat-header"><h2><i class="fas fa-comments"></i> Messages</h2><div class="chat-actions"><button class="chat-action-btn" onclick="window.location.reload()"><i class="fas fa-sync-alt"></i></button></div></div><div class="chat-container"><div class="contacts-sidebar"><div class="contacts-search"><input type="text" id="contactSearch" placeholder="Search contacts..." oninput="filterContacts()"></div><div class="contacts-list" id="contactsList">${cc.length ? renderContactsList(cc) : '<div class="no-contact-selected"><i class="fas fa-users"></i><p>No conversations yet</p></div>'}</div></div><div class="messages-area" id="messagesArea">${currentChatPartner ? renderMessagesArea() : (cc.length ? '<div class="no-contact-selected"><i class="fas fa-comment-dots"></i><p>Select a contact</p></div>' : '<div class="no-contact-selected"><i class="fas fa-comments"></i><p>Your conversations will appear here</p><button class="start-chat-btn" onclick="window.location.href=\'buy.html\'"><i class="fas fa-shopping-bag"></i> Browse Products</button></div>')}</div></div>`;
      if (currentChatPartner) { loadMessages(); setTimeout(attachSendListener, 300); }
      else if (cc.length > 0 && !currentChatPartner) setTimeout(() => selectContact(cc[0].username), 100);
    }

    function renderContactsList(cc) { return cc.map(c => `<div class="contact-item ${currentChatPartner===c.username?'active':''}" onclick="window.chatSelectContact('${c.username}')"><div class="contact-avatar">${c.profileImage?`<img src="${c.profileImage}" alt="">`:c.username.charAt(0).toUpperCase()}</div><div class="contact-info"><div class="contact-header"><span class="contact-name">${c.username}</span><span class="contact-time">${formatTime(c.timestamp)}</span></div><div class="contact-product">${c.productName}</div><div class="contact-last-message">${c.lastMessage}</div></div><div class="contact-right-actions">${c.unread?'<span class="unread-badge">New</span>':''}<button class="delete-contact-btn" onclick="event.stopPropagation();window.confirmDeleteChat('${c.username}')"><i class="fas fa-trash-alt"></i></button></div></div>`).join(''); }
    function renderMessagesArea() { return `<div class="messages-header"><div class="messages-header-avatar">${currentChatPartner?.charAt(0).toUpperCase()}</div><div class="messages-header-info"><div class="messages-header-name">${currentChatPartner}</div><div class="messages-header-product">${currentProductContext?.name || 'Chat'}</div></div></div><div class="messages-container" id="messagesContainer"></div><div class="message-input-area"><input type="text" class="message-input" id="messageInput" placeholder="Type your message..."><button class="message-send-btn" id="chatSendBtn"><i class="fas fa-paper-plane"></i></button></div>`; }

    window.chatSelectContact = selectContact;
    window.filterContacts = filterContacts;

    function loadMessages() {
      if (!currentUser || !currentChatPartner) return;
      if (messagesListener) messagesListener();
      messagesListener = onValue(ref(database, 'chats'), (snap) => {
        if (!snap.exists()) return;
        const msgs = []; const data = snap.val();
        for (const k in data) { const c = data[k]; if ((c.sender===currentUser.email&&c.receiver===currentChatPartner)||(c.sender===currentChatPartner&&c.receiver===currentUser.email)) msgs.push(c); }
        msgs.sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
        const ctr = document.getElementById('messagesContainer');
        if (ctr) { ctr.innerHTML = msgs.length ? msgs.map(m => `<div class="message ${m.sender===currentUser.email?'sent':'received'}"><div class="message-bubble">${m.message}</div><div class="message-time">${new Date(m.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('') : '<div class="no-messages"><i class="fas fa-comment"></i><p>No messages yet</p></div>'; ctr.scrollTop = ctr.scrollHeight; }
      });
    }

    async function markMessagesAsRead(u) { if (!currentUser) return; const s = await get(ref(database, 'chats')); if (!s.exists()) return; const up = {}; const data = s.val(); for (const k in data) { const c = data[k]; if (c.receiver===currentUser.email&&c.sender===u&&!c.read) up[`${k}/read`] = true; } if (Object.keys(up).length) await update(ref(database), up); }

    onAuthStateChanged(auth, async (u) => { currentUser = u; await updateProfile(u); await loadCart(); loadAllChats(); });
    logoutBtn.addEventListener('click', async (e) => { e.preventDefault(); await signOut(auth); showToast('Logged out', 'success'); setTimeout(()=>window.location.href='index.html',1000); });
    if (menuLogoutBtn) menuLogoutBtn.addEventListener('click', async () => { await signOut(auth); showToast('Logged out', 'success'); setTimeout(()=>window.location.href='index.html',1000); });
    document.querySelectorAll('.lang-option').forEach(o => { let l = localStorage.getItem('guraneza_lang')||'en'; o.classList.toggle('active', o.dataset.lang===l); o.addEventListener('click', () => { localStorage.setItem('guraneza_lang', o.dataset.lang); document.querySelectorAll('.lang-option').forEach(x => x.classList.toggle('active', x.dataset.lang===o.dataset.lang)); }); });
  </script>
